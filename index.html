<!doctype html>
<!-- Походження: створено для цієї практичної роботи за допомогою Codex.
     Сторонні шаблони та стилі не копіювалися. Аналіз прав: README.md. -->
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Перегляд завдання — практична робота 2</title>
  <style>
    body { font: 18px/1.6 system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #162238; }
    main { max-width: 640px; margin: 60px auto; padding: 32px; background: white; border-radius: 16px; }
    h1 { font-size: 30px; line-height: 1.2; }
    label, input { display: block; }
    input { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0 16px; font: inherit; border: 1px solid #728097; border-radius: 6px; }
    button { padding: 12px 20px; font: inherit; color: white; background: #214e9c; border: 0; border-radius: 6px; cursor: pointer; }
    .result { padding: 16px; background: #eef3fa; overflow-wrap: anywhere; }
    small { display: block; margin-top: 24px; color: #4b596b; }
    @media (max-width: 700px) { main { margin: 16px; padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>Перегляд завдання</h1>
    <p>Навчальний приклад поєднання власної реалізації та стороннього коду з MIT License.</p>
    <form method="get" action="/">
      <label for="title">Назва завдання</label>
      <input id="title" name="title" maxlength="200" required placeholder="Наприклад, підготувати звіт">
      <button type="submit">Показати</button>
    </form>
    <p class="result"><!-- TASK_PREVIEW --></p>
    <small>Дані не зберігаються. Назва передається в URL, тому не вводьте конфіденційні дані.</small>
  </main>
</body>
</html>
